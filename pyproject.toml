[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eecalc"
version = "0.1.0"
description = "The electronics calculations you keep Googling: IPC-2221 trace width, E-series values, dividers, LED resistors, RC/LC filters."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aysel Elshenawy" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["electronics", "electrical-engineering", "pcb", "ipc-2221", "e-series", "resistor", "calculator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/aysel-elsh/eecalc"
Issues = "https://github.com/aysel-elsh/eecalc/issues"

[project.scripts]
eecalc = "eecalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --import-mode=importlib"
testpaths = ["tests", "src/eecalc"]
